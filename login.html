<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UnlockZone — Login / Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070f;--surface:#0f0f1a;--surface2:#161625;
  --border:#1e1e30;--accent:#00e5a0;--accent2:#7c3aed;
  --text:#eeeef8;--muted:#5a5a78;--red:#ff4757;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 800px 500px at 50% -100px,rgba(124,58,237,0.18),transparent),
    radial-gradient(ellipse 500px 400px at 100% 100%,rgba(0,229,160,0.08),transparent);
}
.wrap{width:100%;max-width:400px;position:relative;z-index:1}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:2rem}
.logo em{color:var(--accent);font-style:normal}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:1.75rem}
.tab{
  flex:1;padding:9px;border:none;border-radius:7px;
  font-size:13px;font-weight:600;font-family:'Syne',sans-serif;
  cursor:pointer;transition:all 0.2s;background:none;color:var(--muted);
}
.tab.active{background:var(--accent2);color:#fff}

.field{margin-bottom:1rem}
label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:5px}
input[type=email],input[type=password]{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;color:var(--text);font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;
  transition:border-color 0.2s;
}
input:focus{border-color:rgba(0,229,160,0.4)}
input::placeholder{color:var(--muted)}

.main-btn{
  width:100%;padding:13px;background:var(--accent);
  color:#07070f;border:none;border-radius:11px;
  font-size:15px;font-weight:700;font-family:'Syne',sans-serif;
  cursor:pointer;transition:all 0.18s;margin-top:0.5rem;
}
.main-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.main-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;filter:none}

.msg{font-size:13px;text-align:center;margin-top:1rem;padding:10px;border-radius:8px;display:none}
.msg.err{background:rgba(255,71,87,0.1);color:var(--red);border:1px solid rgba(255,71,87,0.2)}
.msg.ok{background:rgba(0,229,160,0.1);color:var(--accent);border:1px solid rgba(0,229,160,0.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Unlock<em>Zone</em></div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="lEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="lPass" placeholder="••••••••"/></div>
      <button class="main-btn" id="loginBtn" onclick="doLogin()">Login</button>
    </div>

    <div id="signupForm" style="display:none">
      <div class="field"><label>Email</label><input type="email" id="sEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="sPass" placeholder="Min 6 characters"/></div>
      <button class="main-btn" id="signupBtn" onclick="doSignup()">Create Account</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// If already logged in, go to dashboard
sb.auth.getSession().then(({data})=>{
  if(data.session) location.href='dashboard.html';
});

function switchTab(t){
  document.getElementById('loginForm').style.display = t==='login'?'block':'none';
  document.getElementById('signupForm').style.display = t==='signup'?'block':'none';
  document.getElementById('loginTab').className = 'tab'+(t==='login'?' active':'');
  document.getElementById('signupTab').className = 'tab'+(t==='signup'?' active':'');
  hideMsg();
}

async function doLogin(){
  const email = document.getElementById('lEmail').value.trim();
  const pass  = document.getElementById('lPass').value;
  if(!email||!pass){ showMsg('Please fill all fields.','err'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Logging in...';
  const {error} = await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent='Login';
  if(error){ showMsg(error.message,'err'); return; }
  location.href='dashboard.html';
}

async function doSignup(){
  const email = document.getElementById('sEmail').value.trim();
  const pass  = document.getElementById('sPass').value;
  if(!email||!pass){ showMsg('Please fill all fields.','err'); return; }
  if(pass.length<6){ showMsg('Password must be at least 6 characters.','err'); return; }
  const btn = document.getElementById('signupBtn');
  btn.disabled=true; btn.textContent='Creating account...';
  const {error} = await sb.auth.signUp({email,password:pass});
  btn.disabled=false; btn.textContent='Create Account';
  if(error){ showMsg(error.message,'err'); return; }
  showMsg('Account created! You can now login.','ok');
  setTimeout(()=>switchTab('login'),2000);
}

function showMsg(m,t){
  const el=document.getElementById('msg');
  el.textContent=m; el.className='msg '+t; el.style.display='block';
}
function hideMsg(){ document.getElementById('msg').style.display='none'; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UnlockZone Dashboard — Link Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a38;--accent:#00e5a0;--text:#f0f0f8;--muted:#6b6b85}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:2rem;display:flex;justify-content:center;align-items:center}
.container{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:2.5rem;width:100%;max-width:600px}
h1{font-family:'Syne',sans-serif;font-size:26px;margin-bottom:1.5rem;text-align:center}
h1 span{color:var(--accent)}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
input{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:15px;margin-bottom:1.5rem;transition:border-color 0.2s}
input:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:14px;background:var(--accent);color:#0a0a0f;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:transform 0.2s}
.btn:hover{transform:translateY(-1px)}
.action-list{margin-bottom:1.5rem}
.action-item{display:flex;align-items:center;justify-content:between;background:var(--surface2);padding:12px 16px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.action-item span{font-size:14px;font-weight:500}
.remove-btn{color:#ff4757;background:none;border:none;cursor:pointer;font-weight:700}
.add-action-btn{background:transparent;border:1px dashed var(--accent);color:var(--accent);padding:10px;width:100%;border-radius:12px;cursor:pointer;font-weight:700;margin-bottom:1.5rem}

/* MODAL / POPUP AS PER capture_2.PNG, w.PNG, n.PNG */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal.open{display:flex}
.modal-content{background:#ffffff;color:#111;border-radius:16px;padding:1.5rem;width:100%;max-width:650px;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:#555}
.modal-title{font-size:20px;font-weight:700;margin-bottom:1.5rem;border-bottom:2px solid #ff4757;padding-bottom:8px}
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1rem}
@media(max-width:500px){.platform-grid{grid-template-columns:1fr}}
.platform-section h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:#333}
.action-opt{display:flex;align-items:center;gap:10px;background:#f5f6f8;padding:12px;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:background 0.2s;font-size:13px;font-weight:500}
.action-opt:hover{background:#e8eaf0}
.action-opt img{width:16px;height:16px}
.input-popup-group{background:var(--surface2);padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border)}
.input-popup-group label{color:var(--text)}
</style>
</head>
<body>

<div class="container">
  <h1>Unlock<span>Zone</span> Panel</h1>
  
  <label>Target Destination URL (Locked Link)</label>
  <input type="url" id="lockedUrl" placeholder="https://example.com/your-file-download" required/>

  <label>Required Requirements / Steps</label>
  <div class="action-list" id="selectedActionsList"></div>
  <button class="add-action-btn" onclick="openModal()">+ Add Verification Requirement</button>

  <button class="btn" onclick="generateLink()">Create Intelligent Lock Link</button>

  <div id="resultBox" style="margin-top:1.5rem; display:none; text-align:center;">
    <label>Your Live Link</label>
    <input type="text" id="finalLink" readonly onclick="this.select()"/>
    <p style="font-size:12px; color:var(--accent)">Click inside the box to copy link!</p>
  </div>
</div>

<!-- CAPTURE_2 MODAL SYSTEM -->
<div class="modal" id="actionModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div class="modal-title">Select Action to add</div>
    
    <div class="platform-grid">
      <!-- YouTube -->
      <div class="platform-section">
        <h3>🔴 YouTube</h3>
        <div class="action-opt" onclick="chooseAction('Subscribe Channel', '#FF0000', '🔴')">Subscribe Channel</div>
        <div class="action-opt" onclick="chooseAction('Like & Comment Video', '#FF0000', '👍')">Like & Comment on Video</div>
        <div class="action-opt" onclick="chooseAction('Share Video', '#FF0000', '📢')">Share Video</div>
      </div>
      <!-- Telegram -->
      <div class="platform-section">
        <h3>🔵 Telegram</h3>
        <div class="action-opt" onclick="chooseAction('Join Telegram', '#229ED9', '✈️')">Join Telegram</div>
      </div>
      <!-- Instagram & TikTok -->
      <div class="platform-section">
        <h3>📸 Instagram & TikTok</h3>
        <div class="action-opt" onclick="chooseAction('Like On Instagram', '#E1306C', '📸')">Like On Instagram</div>
        <div class="action-opt" onclick="chooseAction('Follow on TikTok', '#000000', '🎵')">Follow on TikTok</div>
      </div>
      <!-- Discord & Others -->
      <div class="platform-section">
        <h3>👾 Discord & Communities</h3>
        <div class="action-opt" onclick="chooseAction('Join Discord', '#5865F2', '👾')">Join Discord</div>
        <div class="action-opt" onclick="chooseAction('Follow on X/Twitter', '#1DA1F2', '🐦')">Follow on X/Twitter</div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let stack = [];

function openModal(){ document.getElementById('actionModal').classList.add('open'); }
function closeModal(){ document.getElementById('actionModal').classList.remove('open'); }

function chooseAction(name, color, icon) {
  closeModal();
  const url = prompt(`Enter URL for: ${name}`);
  if(!url) return;
  
  stack.push({ name, color, icon, url });
  renderStack();
}

function renderStack(){
  const container = document.getElementById('selectedActionsList');
  container.innerHTML = '';
  stack.forEach((item, i) => {
    container.innerHTML += `
      <div class="action-item">
        <span>${item.icon} <strong>${item.name}</strong></span>
        <button class="remove-btn" onclick="removeStack(${i})">Remove</button>
      </div>
    `;
  });
}

function removeStack(i){
  stack.splice(i, 1);
  renderStack();
}

async function generateLink(){
  const dest = document.getElementById('lockedUrl').value;
  if(!dest || stack.length === 0){ alert('Please add a target URL and at least one tracking step.'); return; }

  const slug = Math.random().toString(36).substring(2, 8);
  const { error } = await sb.from('links').insert([{ slug: slug, locked_url: dest, channels: JSON.stringify(stack) }]);

  if(error) { alert('Database saving error'); } 
  else {
    document.getElementById('resultBox').style.style.display = 'block';
    document.getElementById('finalLink').value = window.location.origin + '/unlock.html?s=' + slug;
  }
}
</script>
</body>
</html>
